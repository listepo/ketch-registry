# Fail-closed tree check. `ketch registry validate` is what docs/REGISTRY.md
# in listepo/ketch says must pass before merge (plan.md F2).
#
# Installed from git until a ketch release ships the `registry` command
# (`ketch 0.1.0` on crates/GitHub does not have it yet).
name: CI

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ketch
        run: cargo install --git https://github.com/listepo/ketch --locked --force
      - name: Validate registry
        run: ketch registry validate .

      - name: rtok include covers Windows
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("rtok/ketch.toml").read_text())
          include = data.get("asset", {}).get("include", [])
          assert any("pc-windows-msvc.zip" in p for p in include), include
          PY
